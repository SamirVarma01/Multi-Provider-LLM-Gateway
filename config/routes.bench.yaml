# Route table for the benchmark stack (scripts/bench.sh). Every provider is a
# virtual provider on the mock; the benchmark scripts set their behavior at
# runtime through the mock's control API.
providers:
  - { name: bench, format: openai, base_url: "http://mock:9000/p/bench/v1", usage_url: "http://mock:9000" }
  - { name: primary, format: openai, base_url: "http://mock:9000/p/primary/v1", usage_url: "http://mock:9000" }
  - { name: backup, format: openai, base_url: "http://mock:9000/p/backup/v1", usage_url: "http://mock:9000" }

models:
  # loadtest: a single target, so routing has no choice to make.
  - alias: bench
    candidates:
      - { provider: bench, model: m-bench, input_per_mtok: 0.15, output_per_mtok: 0.60, max_output: 4096 }
  # failover_test: the primary until it fails, then the backup.
  - alias: failover
    policy: priority
    candidates:
      - { provider: primary, model: m-fo, input_per_mtok: 0.15, output_per_mtok: 0.60, priority: 1, max_output: 4096 }
      - { provider: backup, model: m-fo, input_per_mtok: 0.20, output_per_mtok: 0.80, priority: 2, max_output: 4096 }
